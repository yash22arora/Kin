name: Kin
options:
  bundleIdPrefix: com.yourteam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kin:
    type: application
    platform: iOS
    sources: [Kin]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kin can lock your sky so only you can see it."
    dependencies:
      - target: KinWidget
        embed: true
  KinWidget:
    type: app-extension
    platform: iOS
    sources: [KinWidget, Kin/Core]
    settings:
      base:
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    info:
      path: KinWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KinTests, Kin/Core]
    dependencies:
      - target: Kin
